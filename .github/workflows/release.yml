name: Release

# Publish a release either by pushing a tag like v0.3.0, or from the Actions tab:
# Release -> Run workflow -> enter a version such as 0.3.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.3.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Work out the version
        id: v
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $version = "${{ inputs.version }}".TrimStart("v") }
          else { $version = "${{ github.ref_name }}".TrimStart("v") }
          if ($version -notmatch '^\d+\.\d+(\.\d+)?$') { throw "Version '$version' should look like 0.3.0" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet test --configuration Release
      - name: Publish single-file exe
        shell: pwsh
        run: |
          dotnet publish src/CardCrafter.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=${{ steps.v.outputs.version }} -o publish
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: YGO Card Crafter ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: publish/YGOCardCrafter.exe
          generate_release_notes: true
